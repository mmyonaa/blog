# Supabase 무료 플랜은 ~7일 무요청 시 프로젝트를 일시정지한다(#66 §5).
# 주 1회 읽기 전용 RPC(get_view)를 호출해 깨어 있게 유지한다.
# 존재하지 않는 slug를 읽으면 0이 돌아올 뿐 데이터 오염이 없다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 * * 1" # 매주 월요일 UTC 03:00 = KST 12:00
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: get_view RPC 호출
        env:
          SUPA_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -sf -X POST "$SUPA_URL/rest/v1/rpc/get_view" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY" \
            -H "Content-Type: application/json" \
            -d '{"post_slug":"__keepalive__"}'
