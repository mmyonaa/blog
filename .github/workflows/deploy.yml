# site/(Astro SSG)를 빌드해 GitHub Pages로 배포한다.
# Pages 소스는 "GitHub Actions" 방식(build_type=workflow) — 별도 배포 브랜치 없음.
# 글 발행(main push)마다 자동 배포되며, Actions 탭에서 수동 실행도 가능하다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 날짜 경계 스냅용 리빌드 — 잔디의 '오늘' 칸, 7일 밖 날짜 표기 등
  # 빌드 타임에 '오늘'을 쓰는 것들이 자정 직후 갱신되도록.
  schedule:
    - cron: "5 15 * * *" # UTC 15:05 = KST 00:05
  workflow_dispatch:
  # daily-post.yml이 발행 후 직접 호출한다 — 봇의 GITHUB_TOKEN push는
  # 재귀 방지 규칙 때문에 push 트리거를 못 일으키므로(자동 발행이 배포 안 되던 버그).
  workflow_call:
    inputs:
      ref:
        description: "빌드할 ref (호출 시 발행 커밋이 포함된 main)"
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

# 연속 push 시 이전 배포는 취소하고 최신만 배포
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # push/dispatch면 트리거 SHA(빈 값 → 기본), workflow_call이면 최신 main
          # (호출 시 github.sha는 발행 "이전" 커밋이라 그대로 쓰면 새 글이 빠진다)
          ref: ${{ inputs.ref || '' }}
      # pnpm 버전은 루트 package.json의 packageManager 필드를 따른다
      - uses: pnpm/action-setup@v6
      # setup-node는 v5에 고정 — v6부터 자동 캐시가 npm 전용이라 cache: pnpm이 깨진다(#72)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 빌드 정보(#41): 푸터에 커밋 SHA를 박기 위해 주입. github.sha가 아니라
      # 실제 체크아웃된 HEAD — workflow_call 경로에서도 발행 커밋을 가리키게.
      - run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pnpm --filter @blog-mcp/site build
        env:
          BUILD_SHA: ${{ env.BUILD_SHA }}
          # 조회수(#66) — PUBLIC_ 값은 빌드 시 클라이언트 번들에 인라인된다(공개 무해 설계)
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      # v4부터 dotfile은 아티팩트에서 제외가 기본 — site/dist엔 dotfile이 없어 무해(#72)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
