# 조회수 일일 스냅샷(#67) — post_views 누적값을 날짜별로 적재해 시계열을 만든다.
# (추이 그래프 #70, "최근 7일" 인기글 #68, 성과 되먹임의 원재료.)
# 매일 요청이 나가므로 무료 플랜 일시정지 방지(keep-alive, 구 #66 §5) 역할도 겸한다.
# snapshot_views()는 멱등(같은 날 재실행 시 upsert) — 수동 재실행에 안전.
name: Supabase daily snapshot

on:
  schedule:
    - cron: "50 14 * * *" # UTC 14:50 = KST 23:50, 하루 경계 직전의 누적값을 그날 몫으로 기록
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: snapshot_views RPC 호출
        env:
          SUPA_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -sf -X POST "$SUPA_URL/rest/v1/rpc/snapshot_views" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
